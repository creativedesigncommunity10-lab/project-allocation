<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Project Allocation · Initial Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .setup-shell{min-height:100vh;display:grid;place-items:center;padding:24px}
    .setup-card{width:min(520px,100%);padding:30px;border-radius:24px}
    .setup-card h1{margin:0 0 8px;color:#0B3C8C;font-size:24px}
    .setup-card p{color:var(--t2);margin:0 0 22px}
    .setup-card label{display:block;margin:14px 0 6px;color:var(--t2);font-size:12px;font-weight:600}
    .setup-card input{width:100%}
    .setup-card button{width:100%;margin-top:20px}
    #result{margin-top:16px;padding:12px 14px;border-radius:12px;display:none;white-space:pre-wrap}
    #result.ok{display:block;background:#DDF4E8;color:#146B43}
    #result.err{display:block;background:#FDE3E3;color:#A72E2E}
  </style>
</head>
<body>
  <main class="setup-shell">
    <section class="card setup-card">
      <h1>Project Allocation Setup</h1>
      <p>Initialize helper sheets across all configured divisions. Existing users and activity data will be preserved.</p>
      <form id="setupForm">
        <label for="setupSecret">Setup Secret</label>
        <input id="setupSecret" type="password" autocomplete="off" required>
        <label for="adminPassword">Initial Admin Password</label>
        <input id="adminPassword" type="password" minlength="8" autocomplete="new-password" required>
        <button class="btn" id="setupButton" type="submit">Initialize Project Allocation</button>
      </form>
      <div id="result" role="status"></div>
    </section>
  </main>
<script>
const form=document.getElementById('setupForm');
const button=document.getElementById('setupButton');
const result=document.getElementById('result');
form.addEventListener('submit',async e=>{
  e.preventDefault();button.disabled=true;button.textContent='Initializing…';result.className='';result.style.display='none';
  try{
    const response=await fetch('/.netlify/functions/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      action:'setup',payload:{setupSecret:document.getElementById('setupSecret').value,adminPassword:document.getElementById('adminPassword').value}
    })});
    const data=await response.json();
    if(!response.ok||!data.success)throw new Error(data.message||'Setup failed.');
    result.className='ok';
    result.textContent='Setup successful. Helper sheets are ready for: '+Object.keys(data.data.divisions||{}).join(', ')+'. Existing users and activity records were preserved. Sign in with your existing account.';
    result.style.display='block';
  }catch(err){result.className='err';result.textContent=err.message;result.style.display='block'}
  finally{button.disabled=false;button.textContent='Initialize Project Allocation'}
});
</script>
</body>
</html>
